<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{csp}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<style>
  :root { color-scheme: dark; --edge: 1px solid var(--vscode-widget-border, #ffffff1a); }
  body {
    margin: 0;
    background: var(--vscode-editor-background);
    color: var(--vscode-foreground);
    font-family: var(--vscode-font-family);
    font-size: var(--vscode-font-size);
  }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 20px 24px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 1.3em; font-weight: 600; margin: 0; }
  .muted { color: var(--vscode-descriptionForeground); }
  .mono { font-family: var(--vscode-editor-font-family, monospace); font-variant-numeric: tabular-nums; }


  .work { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
  /* the wheel gives width back before the row wraps, so the preview stays beside it */
  #surface { flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .side { flex: 1 1 270px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .side > :first-child { flex: none; min-height: 0; }
  /* the preview earns its place only beside the wheel: once the column wraps under it, it goes */
  .side.stacked .win { display: none; }

  canvas { display: block; touch-action: none; }
  .hit { position: relative; outline: none; cursor: crosshair; }
  .hit:focus-visible { box-shadow: 0 0 0 2px var(--vscode-focusBorder); }
  /* the press focuses the wheel itself, so its ring is for keyboard focus only */
  .hit.tapped:focus-visible { box-shadow: none; }
  .dot {
    position: absolute; pointer-events: none; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #000a, 0 1px 4px #0008; transform: translate(-50%, -50%);
  }

  /* atlas */
  .lanes { display: flex; gap: 8px; }
  .cap { flex: 0 0 46px; display: flex; flex-direction: column; gap: 4px; }
  .cap button { flex: 1; border: 0; border-radius: 5px; cursor: pointer; box-shadow: inset 0 0 0 1px #ffffff26; padding: 0; }
  .lane { position: relative; border-radius: 5px; overflow: hidden; cursor: ew-resize; }
  .lane .chipp { position: absolute; top: 3px; bottom: 3px; width: 13px; margin-left: -6px; border-radius: 3px; box-shadow: 0 0 0 1px #00000077; cursor: pointer; }
  .lane .chipp.on { box-shadow: 0 0 0 2px #fff; }
  .play { position: absolute; top: -2px; width: 1px; background: #fff; pointer-events: none; }
  .axis { display: flex; justify-content: space-between; font-size: .75em; color: var(--vscode-descriptionForeground); }

  /* window preview: a whole window at 4:3, so the pair is shown on every surface it paints */
  .win {
    /* the width is pinned and the height has a floor, so a wrapped column can never collapse it */
    aspect-ratio: 4 / 3; width: 100%; max-width: 440px; min-height: 180px; flex: none;
    display: flex; flex-direction: column;
    border-radius: 7px; overflow: hidden; font-size: 11px; line-height: 1;
    background: var(--pane); box-shadow: 0 0 13px #ffffff1c;
  }
  .win .bar { flex: 0 0 9%; background: var(--frame); color: #cccccc; display: flex; align-items: center; padding: 0 9px; }
  .win .tabrow { flex: 0 0 9%; background: var(--frame); display: flex; align-items: flex-end; padding: 0 5px; gap: 2px; }
  .win .tabrow b {
    font-weight: 400; font-size: .78em; color: #b5b5b5;
    padding: 3px 9px 4px; border-radius: 5px 5px 0 0;
  }
  .win .tabrow b.on { background: var(--pane); color: #d7d7d7; }
  .win .body { flex: 1; min-height: 0; display: flex; gap: 1px; }
  .win .ab { flex: 0 0 22px; background: var(--pane); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
  .win .ab i { position: relative; width: 11px; height: 11px; border-radius: 3px; background: #ffffff26; }
  .win .ab i.on { background: #ffffff4d; }
  .win .ab i.on::before {
    content: ""; position: absolute; left: -5.5px; top: -2px; width: 2px; height: 15px;
    background: var(--mark);
  }
  .win .sb { flex: 0 0 34%; min-width: 0; background: var(--pane); padding: 8px 7px; display: flex; flex-direction: column; gap: 7px; }
  .win .sb u, .win .pan b { font-size: .72em; letter-spacing: .06em; color: #b5b5b5; text-decoration: none; }
  .win .sb i, .win .ed i, .win .pan i { display: block; height: 5px; border-radius: 2px; background: #ffffff1f; }
  .win .sb i.sel { height: 13px; margin: -4px -7px; border-radius: 0; background: var(--sel); }
  .win .ed { flex: 1; min-width: 0; background: var(--pane); padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; }
  .win .ed i { background: #ffffff1c; }
  .win .ed i.link { background: var(--ink); opacity: .85; }
  .win .ed i.selbar { background: var(--selbg); height: 8px; }
  .win .caretline { display: flex; align-items: center; gap: 3px; }
  .win .caretline i { flex: 0 0 44%; }
  .win .caret { width: 2px; height: 11px; background: var(--caret); }
  .win .btn {
    align-self: flex-start; margin-top: auto; font-size: 9px; padding: 3px 10px; border-radius: 3px;
    background: var(--fill); color: var(--fillText);
  }
  .win .pan { flex: 0 0 22%; background: var(--pane); padding: 0 9px 7px; display: flex; flex-direction: column; gap: 7px; }
  .win .pan .pantabs { display: flex; gap: 12px; padding: 7px 0 5px; }
  .win .pan b { display: inline-block; padding-bottom: 4px; border-bottom: 2px solid transparent; }
  .win .pan b.on { color: #d7d7d7; border-bottom-color: var(--mark); }
  .win .st { flex: 0 0 8%; background: var(--frame); color: #cccccc; display: flex; align-items: center; gap: 7px; padding: 0 9px; font-size: 9px; }
  .win .st .badge { margin-left: auto; padding: 1px 6px; border-radius: 999px; background: var(--fill); color: var(--fillText); }

  .lab { font-size: .95em; color: var(--vscode-foreground); }
  .row { display: flex; flex-wrap: wrap; gap: 7px; }
  .sug {
    display: flex; align-items: center; gap: 8px; padding: 5px 13px 5px 6px; cursor: pointer;
    border: var(--edge); border-radius: 999px; background: none; color: var(--vscode-foreground); font: inherit;
  }
  .sug:hover { background: var(--vscode-list-hoverBackground); }
  .sug i { width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1px #ffffff26; }
  .sw button {
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; cursor: pointer;
    box-shadow: inset 0 0 0 1px #ffffff26;
  }
  .sw button.on { outline: 2px solid var(--vscode-foreground); outline-offset: 2px; }

  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 13px; }
  .switch {
    box-sizing: border-box; position: relative; flex: none; width: 34px; height: 18px; padding: 0;
    border: var(--edge); border-radius: 999px; cursor: pointer;
    background: var(--vscode-input-background, #ffffff12); transition: background .13s;
  }
  .switch i {
    position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--vscode-descriptionForeground); transition: transform .13s, background .13s;
  }
  .switch[aria-checked="true"] { background: var(--vscode-button-background); border-color: transparent; }
  .switch[aria-checked="true"] i { transform: translateX(16px); background: var(--vscode-button-foreground); }
  .switch:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 2px; }


  .ctl {
    margin-top: auto; padding-top: 14px; border-top: var(--edge);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  }
  .ctl .acts { margin-left: auto; display: flex; gap: 7px; }
  .hexes { display: flex; gap: 14px; }
  .hexf { display: flex; align-items: center; gap: 6px; }
  .hexf span { font-size: .9em; color: var(--vscode-descriptionForeground); }
  input {
    width: 9ch; padding: 4px 6px; border-radius: 4px;
    font-family: var(--vscode-editor-font-family, monospace); font-size: 1.05em;
    background: var(--vscode-input-background); color: var(--vscode-input-foreground);
    border: 1px solid var(--vscode-input-border, transparent);
  }
  input:focus { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .ctl button {
    padding: 4px 13px; border: 0; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: .9em;
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
  }
  .ctl button.secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); }
  .ctl button:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>

  <div class="work">
    <div id="surface"></div>
    <div class="side">
      <div>
        <div class="win" id="win">
          <div class="bar"><span id="w-title"></span></div>
          <div class="tabrow"><b class="on">index.js</b><b>styles.css</b><b>readme.md</b></div>
          <div class="body">
            <div class="ab"><i class="on"></i><i></i><i></i><i></i></div>
            <div class="sb">
              <u>EXPLORER</u>
              <i style="width:76%"></i>
              <i class="sel"></i>
              <i style="width:54%"></i>
              <i style="width:68%"></i>
              <i style="width:46%"></i>
            </div>
            <div class="ed">
              <i style="width:70%"></i>
              <i class="link" style="width:38%"></i>
              <span class="caretline"><i></i><span class="caret"></span></span>
              <i class="selbar" style="width:54%"></i>
              <i style="width:62%"></i>
              <i style="width:44%"></i>
              <span class="btn">Apply</span>
            </div>
          </div>
          <div class="pan">
            <div class="pantabs"><b class="on">TERMINAL</b><b>PROBLEMS</b></div>
            <i style="width:58%"></i>
            <i style="width:34%"></i>
          </div>
          <div class="st"><span id="w-sttext"></span><span class="badge">3</span></div>
        </div>
        <div class="switchrow">
          <span class="lab">Show the colors already available in Themepane</span>
          <button type="button" class="switch" id="r-toggle" role="switch" aria-checked="true" aria-label="Show the colors already available in Themepane"><i></i></button>
        </div>
      </div>
      <div id="sug-box">
        <div class="lab" style="margin-bottom:7px">Suggested accents</div>
        <div class="row" id="sug"></div>
      </div>
      <div id="rec-box" hidden>
        <div class="lab" style="margin-bottom:7px">Recent</div>
        <div class="row sw" id="rec"></div>
      </div>
      <div class="ctl">
        <span class="hexes">
          <label class="hexf"><span>Background</span><input id="hex-background" spellcheck="false" maxlength="7"></label>
          <label class="hexf"><span>Accent</span><input id="hex-accent" spellcheck="false" maxlength="7"></label>
        </span>
        <span class="acts">
          <button class="secondary" id="cancel">Cancel</button>
          <button id="apply">Apply</button>
        </span>
      </div>
    </div>
  </div>

  <div id="presets"></div>
</main>
<script nonce="{{nonce}}">var module = { exports: {} };</script>
<script nonce="{{nonce}}" src="{{tint}}"></script>
<script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
