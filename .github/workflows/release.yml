# A push to main whose package.json version has no release yet builds the VSIX and publishes
# it as release v<version>; gh creates the tag. Pushes that keep the version do nothing.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Skip if this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      # Bundles jsonc-parser, which the uninstall hook (revert.js) needs.
      - if: steps.version.outputs.new == 'true'
        run: npm ci --omit=dev
      - if: steps.version.outputs.new == 'true'
        run: npx -y @vscode/vsce@3 package -o themepane.vsix
      - name: Check the package contents
        if: steps.version.outputs.new == 'true'
        run: |
          files="$(npx -y @vscode/vsce@3 ls)"
          echo "$files"
          for f in extension.js tint.js revert.js node_modules/jsonc-parser/lib/umd/main.js; do
            grep -qx "$f" <<<"$files" || { echo "Missing from the VSIX: $f"; exit 1; }
          done
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" themepane.vsix --target "$GITHUB_SHA" --title "Themepane $TAG" --generate-notes
