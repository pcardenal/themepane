# Push a tag like v1.0.0 to build the VSIX and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      # Bundles jsonc-parser, which the uninstall hook (revert.js) needs.
      - run: npm ci --omit=dev
      - run: npx -y @vscode/vsce@3 package -o themepane.vsix
      - name: Check the package contents
        run: |
          files="$(npx -y @vscode/vsce@3 ls)"
          echo "$files"
          for f in extension.js tint.js revert.js node_modules/jsonc-parser/lib/umd/main.js; do
            grep -qx "$f" <<<"$files" || { echo "Missing from the VSIX: $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" themepane.vsix --title "Themepane $GITHUB_REF_NAME" --generate-notes
